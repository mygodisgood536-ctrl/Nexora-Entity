# Cloud verification for Nexora Entity.
#
# This workflow runs the checks that do not require PostgreSQL or OpenCode. Both of those
# integrations are deliberately pending, so nothing here starts a database or an AI bridge:
# a green run means "lint, types, unit tests and a production build are sound", not "the product
# is fully operational".
#
# The database-backed end-to-end suites (npm run smoke, npm run e2e:engine, npm run check:site)
# require a live PostgreSQL and are not run here. See docs/DEPENDENCY-REGISTER.md.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Platform-native binaries (rollup, esbuild, sharp, tailwind oxide, lightningcss) are
      # optionalDependencies, and the Windows lockfile would not carry the linux ones. Installing
      # normally here is correct and does not install OpenCode's runtime on any developer machine.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify standalone assets were copied
        run: test -d packages/web/.next/standalone/packages/web/.next/static

      # Boots the real production server and exercises the routes that do not touch the database:
      # landing, login, signup, protected-route redirects, media traversal, anonymous API refusal.
      - name: Runtime smoke (no database)
        run: |
          npm run web:start
          npm run smoke:public
        env:
          NEXORA_COOKIE_SECURE: 'false'

      - name: Stop the platform
        if: always()
        run: npm run web:stop